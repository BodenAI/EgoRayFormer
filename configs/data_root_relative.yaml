# Root-relative protocol as used by TSR-Ego (arXiv 2607.09169, Sec. 4.1): UnrealEgo2 root = pelvis, UnrealEgo-RW
# root = mid-hip (no pelvis annotated). Joint UE2 + RW training at 256x256 (TSR-Ego's resolution).
# Every run also reports the translation-free mid-hip-centred MPJPE (metrics '*/mpjpe_root'), so device- and
# root-relative models can be compared on the same footing.
#   python run.py fit --config configs/base_unrealego.yaml --config configs/data_root_relative.yaml --config configs/baseline_tsr_ego.yaml
data:
  train:
    - {dataset: unrealego2, split: train, weight: 1.0}
    - {dataset: unrealego_rw, split: train, weight: 3.0}
  val:
    - {dataset: unrealego2, split: validation}
    - {dataset: unrealego_rw, split: validation}
  test:
    - {dataset: unrealego2, split: test}
    - {dataset: unrealego_rw, split: test}
  target_frame: root
  weighted_sampling: true
  img_size: 256
  batch_size: 16
  eval_batch_size: 32
model:
  export_name_style: unrealego2
  model:
    image_size: 256
    rigs: [unrealego]   # rigs of the datasets (index.json of the records) are registered automatically at setup
trainer:
  default_root_dir: ./work_dirs/ue2rw_root_256
  logger:
    - class_path: pytorch_lightning.loggers.CSVLogger
      init_args: {save_dir: ./work_dirs/ue2rw_root_256}
