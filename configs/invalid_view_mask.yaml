# Views in which a joint's sampling points fall outside the field of view carry no matching evidence: their features
# are replaced by a learned missing-view token, and the geometry gate closes when fewer than two views are valid
# (model.model.p2_mask_invalid_views). Also keeps the best-validation (val/mpjpe) and the last checkpoint.
# Part of every EgoRayFormer configuration of the paper; compose after egorayformer_full.yaml + ablations/no_p4.yaml.
model:
  model:
    p2_mask_invalid_views: true
trainer:
  callbacks:
    - class_path: pytorch_lightning.callbacks.TQDMProgressBar
      init_args: {refresh_rate: 50}
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mpjpe
        mode: min
        save_top_k: 1
        save_last: true
        filename: "epoch={epoch}"
        auto_insert_metric_name: false
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args: {logging_interval: step}
